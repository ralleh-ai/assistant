# cargo-deny configuration — supply-chain gate (finding M6).
#
# CI runs `cargo deny check advisories bans sources` against each of the
# three Cargo projects (workspace, desktop-edge/src-tauri,
# presence-prototype). This catches a known-vulnerable or yanked
# dependency, an unexpected duplicate pulled in by a careless bump, and a
# crate sourced from somewhere other than crates.io — the three things a
# `cargo build` will happily do silently.
#
# Licenses are intentionally NOT enforced in the CI gate yet: license
# policy is a separate, opinionated decision and a too-strict allow-list
# would fail the build on a legitimate transitive dependency. The section
# below documents the intended allow-list so it can be switched on
# (`cargo deny check licenses`) once the dependency tree is audited.

[advisories]
# RustSec advisory database. `vulnerability`/`unmaintained`/`yanked` are
# denied by default in cargo-deny v2; list specific advisory IDs here to
# grant a reviewed, time-boxed exception rather than disabling the check.
version = 2
ignore = []

[bans]
# A brand-new duplicate major version is usually an accidental bump; warn
# rather than fail so it surfaces in the log without blocking unrelated
# work. Wildcard version requirements are a reproducibility hazard.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io + the official git deps we vet. Anything from an unknown
# registry or git host is a supply-chain red flag.
unknown-registry = "deny"
unknown-git = "deny"

# --- License policy (documented, not yet enforced in CI) -------------------
# Enable with `cargo deny check licenses` once the tree is audited.
[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  "OpenSSL",
]

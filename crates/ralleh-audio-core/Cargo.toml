[package]
name = "ralleh-audio-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Live microphone via cpal (WASAPI/ALSA/CoreAudio). Off by default so
# headless CI/dev never needs libasound / device access.
#   cargo test -p ralleh-audio-core --features mic
mic = ["dep:cpal"]
# Live speaker playback via cpal (same host backends as `mic`, same
# opt-in reasoning). Enables `CpalPlaybackSink` — the shell's TTS
# path uses this to actually make the synthesized audio audible.
#   cargo test -p ralleh-audio-core --features playback
playback = ["dep:cpal"]
# Native whisper.cpp via whisper-rs (ADR-003). Off by default.
whisper = ["dep:whisper-rs"]

[dependencies]
serde.workspace = true
thiserror.workspace = true
# Secure, RAII-cleaned temp files for the CLI STT/TTS bridges (private 0700
# dir, unpredictable name, auto-removed on drop even on panic).
tempfile = "3"
cpal = { version = "0.15", optional = true }
# 0.13: in-process whisper.cpp. On Windows MSVC, bindgen often fails;
# use WhisperCliStt + tools/whisper instead.
whisper-rs = { version = "0.13", optional = true }

[[bin]]
name = "mic-capture"
path = "src/bin/mic_capture.rs"
required-features = ["mic"]

[dev-dependencies]

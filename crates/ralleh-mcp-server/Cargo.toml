[package]
name = "ralleh-mcp-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ralleh-mcp-server"
path = "src/main.rs"

[dependencies]
ralleh-policy-core = { path = "../ralleh-policy-core" }
ralleh-tool-gateway = { path = "../ralleh-tool-gateway" }
ralleh-ai-router = { path = "../ralleh-ai-router" }
ralleh-audit-store = { path = "../ralleh-audit-store" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml = "0.8"
uuid.workspace = true
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[workspace]
resolver = "2"
members = [
    "crates/ralleh-policy-core",
    "crates/ralleh-audio-core",
    "crates/ralleh-os-capabilities",
    "crates/ralleh-tool-gateway",
    "crates/ralleh-mcp-server",
    "crates/ralleh-ai-router",
    "crates/ralleh-audit-store",
    "crates/presence-ipc",
    "crates/presence-brain",
]
# Tauri edge app is its own Cargo project (needs WebView; not headless CI).
# presence-prototype needs a GPU/window surface (winit + wgpu); same rule.
exclude = ["desktop-edge/src-tauri", "presence-prototype"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
authors = ["Ralleh Project"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"

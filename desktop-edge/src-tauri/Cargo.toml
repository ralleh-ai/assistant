[package]
name = "desktop-edge"
version = "0.1.0"
description = "Ralleh desktop edge shell (Tauri v2 + React)"
authors = ["Ralleh Project"]
edition = "2021"
license = "UNLICENSED"

[lib]
name = "desktop_edge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ralleh-audio-core = { path = "../../crates/ralleh-audio-core" }
ralleh-os-capabilities = { path = "../../crates/ralleh-os-capabilities" }
ralleh-policy-core = { path = "../../crates/ralleh-policy-core" }

[features]
default = []
# Real OS clipboard (arboard). Default builds use the mock backend.
clipboard-os = ["ralleh-os-capabilities/clipboard-os"]
# Live microphone via cpal (WASAPI). Off by default for headless-safe builds.
mic = ["ralleh-audio-core/mic"]

[package]
name = "desktop-edge"
version = "0.1.0"
description = "Ralleh desktop edge shell (Tauri v2 + React)"
authors = ["Ralleh Project"]
edition = "2021"
license = "UNLICENSED"

[lib]
name = "desktop_edge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ralleh-audio-core = { path = "../../crates/ralleh-audio-core" }
ralleh-os-capabilities = { path = "../../crates/ralleh-os-capabilities" }
ralleh-policy-core = { path = "../../crates/ralleh-policy-core" }
# Phase 3 §3.2 — real router + tool gateway inside the shell process,
# so `thinking` and `tool_use` engage on real work rather than dev
# panel toggles. `EchoBackend` / `EchoHandler` are the default
# backends (shell owns nothing sensitive by default); real HTTP /
# LLM backends will slot in behind these traits in Phase 4.
ralleh-ai-router = { path = "../../crates/ralleh-ai-router" }
ralleh-tool-gateway = { path = "../../crates/ralleh-tool-gateway" }
# Wire types for the presence renderer child process (Phase 2 §3 —
# docs/PRESENCE_INTEGRATION_PLAN.md, ADR-013). Same crate the presence
# runtime consumes; keeping the two in lockstep is why it lives in the
# root workspace's `crates/`.
presence-ipc = { path = "../../crates/presence-ipc" }
log = "0.4"
# OS-native secret storage: Windows Credential Manager, macOS
# Keychain, Linux Secret Service (GNOME Keyring / KWallet). We keep
# API keys out of the cleartext `edge-settings.json` on any host
# that has a working keychain, and fall back to `NullStore` (which
# just refuses writes) elsewhere. `apple-native` + `windows-native`
# + `sync-secret-service` cover the three desktop targets without
# pulling the async runtimes some other backends require. Version
# pinned to the 3.x line — 4.x is a breaking API rework, revisit
# when the ecosystem catches up.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[features]
default = ["mic", "playback"]
# Real OS clipboard (arboard). Opt-in; mock is the default clipboard backend.
clipboard-os = ["ralleh-os-capabilities/clipboard-os"]
# Live microphone via cpal (WASAPI). On by default for this desktop shell;
# workspace `ralleh-audio-core` stays mic-off so headless CI is unchanged.
mic = ["ralleh-audio-core/mic"]
# Live speaker playback via cpal (WASAPI). On by default for this desktop
# shell so synthesized TTS is audible; same rationale as `mic`.
playback = ["ralleh-audio-core/playback"]

[package]
name = "desktop-edge"
version = "0.1.0"
description = "Ralleh desktop edge shell (Tauri v2 + React)"
authors = ["Ralleh Project"]
edition = "2021"
license = "UNLICENSED"

[lib]
name = "desktop_edge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ralleh-audio-core = { path = "../../crates/ralleh-audio-core" }

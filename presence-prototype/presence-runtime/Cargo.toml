[package]
name = "presence-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Point Cloud Presence — winit + wgpu runtime that hosts `presence-core`. Owns the window, event loop, and the egui debug panel."

[[bin]]
name = "presence-runtime"
path = "src/main.rs"

[features]
# The `dev` feature carries the egui debug overlay + its window hooks. On by
# default while `presence-prototype` is the primary way we exercise the
# library; a shipping build (Phase 3) uses `--no-default-features` to strip
# egui and its ~30 transitive crates out of the runtime. See Phase 2 §1 of
# docs/PRESENCE_INTEGRATION_PLAN.md.
default = ["dev"]
dev = ["dep:egui", "dep:egui-wgpu", "dep:egui-winit"]

[dependencies]
presence-core = { path = "../presence-core" }
winit = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }

egui = { workspace = true, optional = true }
egui-wgpu = { workspace = true, optional = true }
egui-winit = { workspace = true, optional = true }

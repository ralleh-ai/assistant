[package]
name = "presence-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Point Cloud Presence — simulation, scene director, and GPU renderer. Library core, no window / event-loop / debug UI. See docs/PRESENCE_VISUAL_ENTITY.md, docs/PRESENCE_SCENES.md, and ADR-013."

[lib]
name = "presence_core"
path = "src/lib.rs"

[features]
default = ["ipc"]
# The `ipc` feature pulls in the `presence-ipc` wire types (from the
# root workspace at `../../crates/presence-ipc`) and adds the
# `SceneDirector::apply_command` bridge. On by default because there is
# no cost to having it — the ipc crate is tiny — and it is the natural
# entry point for the shell integration in Phase 2 §3.
ipc = ["dep:presence-ipc"]

[dependencies]
winit = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true }
noise = { workspace = true }
rand = { workspace = true }
log = { workspace = true }

# `presence-ipc` lives in the root workspace (headless-safe). Depending on
# it by path across workspaces is fine — cargo treats it as a normal path
# dep — but it does mean the `Cargo.lock` here and the one at the repo
# root are separate files. That is already the case for every other dep
# this crate has, so nothing new to reconcile.
presence-ipc = { path = "../../crates/presence-ipc", optional = true }

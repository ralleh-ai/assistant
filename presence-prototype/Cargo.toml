[workspace]
resolver = "2"
members = ["presence-core", "presence-runtime"]
default-members = ["presence-runtime"]

# Two-crate layout for Phase 2 §1 of docs/PRESENCE_INTEGRATION_PLAN.md:
# - `presence-core` is the library — simulation, scene director, and renderer.
#   No window creation, no key handling, no debug overlay.
# - `presence-runtime` is the binary that hosts the library — winit event loop,
#   window management, and the egui debug panel.
#
# The workspace lives inside `presence-prototype/` (not at the repo root)
# because the root workspace excludes this whole subtree — the presence
# prototype needs a GPU + window and can't build headless in CI. See the
# root `Cargo.toml` exclude list and the note in `HEADLESS.md`.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
winit = "0.30"
wgpu = "22"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
noise = "0.9"
rand = { version = "0.8", features = ["small_rng"] }
egui = "0.29"
egui-wgpu = "0.29"
egui-winit = "0.29"
log = "0.4"
env_logger = "0.11"

# Match the tuning that the single-crate prototype had: the hot path lives
# in dependency code (`noise`'s 4-D Simplex), so we build deps at opt-level 3
# even in `cargo run`, and keep our own crates at opt-level 1 so debug info
# still means something. See the original comment in the pre-split manifest.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[package]
name = "presence-prototype"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
description = "Phase 1 standalone prototype for the Point Cloud Presence / Live System Scanner (docs/PRESENCE_VISUAL_ENTITY.md). winit + wgpu, not part of the main Cargo workspace (see root Cargo.toml exclude list / HEADLESS.md)."
publish = false

[[bin]]
name = "presence-prototype"
path = "src/main.rs"

[dependencies]
winit = "0.30"
wgpu = "22"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
noise = "0.9"
rand = { version = "0.8", features = ["small_rng"] }
egui = "0.29"
egui-wgpu = "0.29"
egui-winit = "0.29"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The simulation's hot path is `noise`'s 4-D Simplex, so an unoptimized
# debug build is dominated by dependency code rather than our own. Building
# dependencies at opt-level 3 while keeping this crate lightly optimized
# makes `cargo run` usable for visual iteration without giving up
# debuggability of the crate's own frames.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

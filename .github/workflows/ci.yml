# CI — enforces the invariants that the local build already checks.
#
# Runs on every push/PR to master. Three parallel jobs:
#
# 1. `workspace` — cargo fmt + clippy + test on the headless Rust
#    workspace (crates/*, presence-ipc). This is the fast lane; a
#    breakage here almost always means the developer forgot to run
#    `cargo test` before pushing.
#
# 2. `desktop-edge` — the Tauri edge app is its own Cargo project
#    (not in the workspace because it needs WebView2 + a bunch of
#    platform crates). On Linux CI we install the webkit2gtk deps
#    Tauri v2 requires, then run cargo test on the Rust side and
#    `tsc --noEmit` + `vite build` on the frontend. Doing all three
#    on the same runner keeps the reproduction path obvious: if CI
#    fails, run the same three commands locally.
#
# 3. `presence-runtime` — the winit/wgpu presence process. It needs
#    a GPU/display in production but `cargo check` and its unit
#    tests work headless because the run loop only spins up under
#    `App::run`. Excluded from the workspace to keep the fast lane
#    fast; verified separately here.
#
# Not-yet-covered: cross-platform (Windows/macOS) build of
# desktop-edge and presence-runtime. Enterprise-grade release
# builds should add that when we start cutting installers.
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  CI: "true"
  # Deny warnings globally so a lint slip on any crate fails the
  # job rather than sitting in the log unnoticed. Local `cargo`
  # picks this up too when the env var is set.
  RUSTFLAGS: "-D warnings"

jobs:
  workspace:
    name: workspace (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Isolate the workspace cache from the sibling desktop-edge
          # / presence-runtime caches so a target-dir invalidation on
          # one doesn't force a rebuild of the others.
          key: workspace

      # Line-ending guard. `.gitattributes` forces LF for every
      # text file that isn't a Windows-native format; a CR
      # slipping into a `.rs`/`.ts`/`.md`/etc. checkout means
      # something bypassed the policy (a merge from an old
      # branch, a paste from an editor with autocrlf on, or a
      # bad `git config`). rustfmt would catch a `.rs` case
      # later but this fails first with a precise diagnostic
      # spanning all tracked text files.
      - name: Check for stray CRLF in tracked text files
        run: |
          set -euo pipefail
          # List tracked files that git considers text under
          # the current attributes. `git ls-files --eol` prints
          # per-file eol info; we grep the index column for
          # `mixed`/`crlf` on any file whose working-tree eol
          # policy is `lf`.
          bad=$(git ls-files --eol -- ':!*.bat' ':!*.cmd' ':!*.ps1' ':!*.psm1' ':!*.sln' \
                | awk '$1 ~ /crlf|mixed/ && $2 !~ /crlf|mixed/ { print $4 }' || true)
          if [ -n "$bad" ]; then
            echo "::error::CRLF found in files that should be LF:"
            echo "$bad"
            exit 1
          fi

      # fmt: with `newline_style = "Unix"` in rustfmt.toml this
      # also enforces LF on every `.rs` file, belt-and-braces
      # against the guard above.
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace

  desktop-edge:
    name: desktop-edge (Tauri shell)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-edge
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Tauri v2 on Linux needs webkit2gtk + a few X libs even for a
      # headless `cargo test`. Without these the tauri-runtime-wry
      # linker fails. Pin the metapackages Tauri's own CI uses.
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config

      - name: Cache cargo (desktop-edge)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-edge/src-tauri -> target
          key: desktop-edge

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # `desktop-edge/package-lock.json` is what npm ci consumes;
          # scope the cache accordingly.
          cache: npm
          cache-dependency-path: desktop-edge/package-lock.json

      - name: npm ci
        run: npm ci

      - name: TypeScript typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      # Frontend build proves the vite bundle is emittable; a
      # missing import or broken CSS reference trips here even if
      # tsc was clean.
      - name: Vite build
        run: npm run build

      - name: cargo fmt --check (src-tauri)
        working-directory: desktop-edge/src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy (src-tauri)
        working-directory: desktop-edge/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test (src-tauri)
        working-directory: desktop-edge/src-tauri
        run: cargo test

  presence-runtime:
    name: presence-runtime (winit/wgpu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: presence-prototype
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # winit needs X11 dev headers even for a headless build --
      # linker resolves them at link time regardless of runtime.
      # No GPU driver needed for `cargo test` because our tests
      # never call into wgpu itself.
      - name: Install X11 dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libxkbcommon-dev libwayland-dev \
            pkg-config

      - name: Cache cargo (presence-runtime)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: presence-prototype -> target
          key: presence-runtime

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace
